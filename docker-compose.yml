services:

    # PHP-FPM application
    app:
        container_name: ${APP_SHORT_NAME}-app
        build:
            context: .
            dockerfile: ./.docker/php/Dockerfile
        volumes:
            - .:${DOCKER_BASE_PATH}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
        networks:
            - app-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "supervisorctl status php-fpm 2>/dev/null | grep -q RUNNING || exit 1"]
            interval: 15s
            retries: 5
            start_period: 20s
            timeout: 5s

    # Web server
    nginx:
        container_name: ${APP_SHORT_NAME}-nginx
        image: nginx:1.26.2
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - .:${DOCKER_BASE_PATH}
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_healthy
        networks:
            - app-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 30s
            retries: 3
            start_period: 30s
            timeout: 10s

    # PostgreSQL database
    db:
        container_name: ${APP_SHORT_NAME}-db
        image: postgres:16.4
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - app-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 5s

    # Redis cache / queue / session store
    redis:
        container_name: ${APP_SHORT_NAME}-redis
        image: redis:7.4.1
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --save 20 1 --loglevel warning
        volumes:
            - redis-data:/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            retries: 5
            start_period: 10s
            timeout: 5s

    # MinIO — S3-compatible object storage
    # Host port 9010 → container 9000 (S3 API): avoids conflict with PhpStorm/Xdebug on 9000
    # Host port 9001 → container 9001 (Web console): http://localhost:9001
    # Laravel connects via internal Docker network: http://minio:9000
    minio:
        container_name: ${APP_SHORT_NAME}-minio
        image: minio/minio:latest
        ports:
            - "9010:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        command: server /data --console-address ":9001"
        volumes:
            - minio-data:/data
        networks:
            - app-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            retries: 3
            start_period: 20s
            timeout: 10s

volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local
    minio-data:
        driver: local

networks:
    app-network:
        driver: bridge
