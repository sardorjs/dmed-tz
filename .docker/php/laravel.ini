; Maximum memory a single PHP process may use
memory_limit = 256M

; Maximum allowed size for uploaded files
upload_max_filesize = 80M

; Maximum size of POST data
post_max_size = 80M

; Maximum execution time per request (seconds)
max_execution_time = 60

; Do not expose errors to the browser (use Laravel's error handler instead)
display_errors = Off

; Do not expose PHP version in X-Powered-By response header
expose_php = Off

; Default timezone — always set explicitly to avoid system-dependent behaviour
date.timezone = UTC

; ---------------------------------------------------------------------------
; OPcache — bytecode cache for significant performance improvement
; ---------------------------------------------------------------------------
opcache.enable = 1

; Memory allocated for the opcode cache (MB)
opcache.memory_consumption = 256

; Memory for interned strings (MB)
opcache.interned_strings_buffer = 16

; Maximum number of files that can be cached
opcache.max_accelerated_files = 20000

; How often (seconds) OPcache checks script timestamps for changes
; Set to 0 in production to disable filesystem checks completely
opcache.revalidate_freq = 2

; Enable/disable timestamp validation (set to 0 in production)
opcache.validate_timestamps = 1

; Preserve PHPDoc comments (required by some frameworks / DI containers)
opcache.save_comments = 1

; Enable fast shutdown sequence
opcache.fast_shutdown = 1
