[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
; Run supervisord itself as root — required to manage processes with different users
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; PHP-FPM must start before Horizon (priority=10 < priority=20)
; NOTE: php-fpm master process MUST run as root so it can fork workers
;       as www-data via pool configuration. Do NOT set user= here.
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
startretries=5
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err

; Laravel Horizon — Redis queue dashboard and worker manager
; autostart=false: started manually after `composer install` via `make setup`
; This avoids the race condition where vendor/ does not exist on first boot
[program:horizon]
command=php /var/www/artisan horizon
directory=/var/www
autostart=false
autorestart=true
user=www-data
priority=20
; Allow Horizon up to 1 hour to finish in-flight jobs before force-kill
stopwaitsecs=3600
startretries=3
stdout_logfile=/var/log/supervisor/horizon.log
stderr_logfile=/var/log/supervisor/horizon.err
